name: mesh_descriptors

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.12

  # Core numerical stack
  - numpy>=1.26
  - scipy>=1.12
  - scikit-learn>=1.4

  # Visualisation
  - matplotlib>=3.8

  # 3D mesh / point cloud (optional but recommended)
  - trimesh>=4.3          # mesh I/O, repair, simplification
  - open3d>=0.18          # point cloud ↔ mesh conversion, ICP, visualisation

  # Jupyter (optional, for interactive exploration)
  - jupyter
  - ipykernel
  - ipywidgets

  # Utilities
  - tqdm                  # progress bars
  - pyyaml                # config files

  # pip-only packages (not on conda-forge)
  - pip
  - pip:
      - pyglet>=2.0       # trimesh interactive viewer backend
